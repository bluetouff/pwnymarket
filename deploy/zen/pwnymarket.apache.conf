<VirtualHost *:80>
    ServerName pwnymarket.fr
    RewriteEngine On
    RewriteRule ^ https://pwnymarket.fr%{REQUEST_URI} [R=308,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/pwnymarket-error.log
    ErrorLogFormat "[%{u}t] [%-m:%l] %M"
    LogLevel crit
    CustomLog ${APACHE_LOG_DIR}/pwnymarket-access.log "[%{%Y-%m-%dT%H:%M:%S%z}t] %>s %B"
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName pwnymarket.fr

    SSLEngine on
    SSLCertificateFile __CERT_DIR__/fullchain.pem
    SSLCertificateKeyFile __CERT_DIR__/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader unset Forwarded early
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Forwarded-Proto early
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / unix:/run/pwnymarket/pwnymarket.sock|http://localhost/ connectiontimeout=2 timeout=10 retry=0
    ProxyPassReverse / unix:/run/pwnymarket/pwnymarket.sock|http://localhost/

    # Normalize both Apache header tables before setting the public policy.
    # https://httpd.apache.org/docs/2.4/mod/mod_headers.html#header
    Header onsuccess unset Content-Security-Policy
    Header onsuccess unset Cross-Origin-Embedder-Policy
    Header onsuccess unset Cross-Origin-Opener-Policy
    Header onsuccess unset Cross-Origin-Resource-Policy
    Header onsuccess unset Permissions-Policy
    Header onsuccess unset Referrer-Policy
    Header onsuccess unset Strict-Transport-Security
    Header onsuccess unset X-Content-Type-Options
    Header onsuccess unset X-Frame-Options
    Header always set Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self'; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'"
    Header always set Cross-Origin-Embedder-Policy "require-corp"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Header always set Referrer-Policy "no-referrer"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"

    AllowEncodedSlashes Off
    LimitRequestBody 1024
    TraceEnable Off

    ErrorLog ${APACHE_LOG_DIR}/pwnymarket-error.log
    ErrorLogFormat "[%{u}t] [%-m:%l] %M"
    LogLevel crit
    CustomLog ${APACHE_LOG_DIR}/pwnymarket-access.log "[%{%Y-%m-%dT%H:%M:%S%z}t] %>s %B"
</VirtualHost>
</IfModule>
