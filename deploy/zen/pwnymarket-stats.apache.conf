# This file is included only inside the pwnymarket.fr TLS virtual host.
# No IP, raw URI, query, method, user-agent, referrer, username or body is logged.
SetEnvIf Request_URI "^" pwny_route=/other
SetEnvIf Request_URI "^/(index\.html)?$" pwny_route=/
SetEnvIf Request_URI "^/about$" pwny_route=/about
SetEnvIf Request_URI "^/privacy$" pwny_route=/privacy
SetEnvIf Request_URI "^/api/votes$" pwny_route=/api/votes
SetEnvIf Request_URI "^/api/markets$" pwny_route=/api/markets
SetEnvIf Request_URI "^/(app\.js|markets\.js|styles\.css|favicon\.svg|marianne\.png|og\.png|robots\.txt)$" pwny_route=/assets
SetEnvIf Request_URI "^/(assets/v2/(app\.js|markets\.js|styles\.css|og\.png)|manrope-medium\.ttf|manrope-OFL\.txt)$" pwny_route=/assets
SetEnvIf Request_URI "^/(stats(/|$)|healthz$)" pwny_skip_stats
CustomLog "|__NODE_BINARY__ /var/www/html/pwnymarket/current/deploy/zen/stats-logger.mjs" "%{%s}t %>s %B %{pwny_route}e" env=!pwny_skip_stats

ProxyPassMatch "^/stats(/|$)" "!"
RedirectMatch 308 "^/stats$" "https://pwnymarket.fr/stats/"
Alias /stats/ /var/lib/pwnymarket-stats/report/
<Directory /var/lib/pwnymarket-stats/report>
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    DirectoryIndex index.html
    AuthType Basic
    AuthName "PwnyMarket - statistiques privees"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/pwnymarket-stats.htpasswd
    Require valid-user
    <FilesMatch "^(?!index\.html$).+">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "^/stats(/|$)">
    Header onsuccess unset Cache-Control
    Header always set Cache-Control "private, no-store, max-age=0"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
</LocationMatch>
